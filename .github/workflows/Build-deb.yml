name: Build Debian package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TUKU Debian package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.1.0"
          STAGE="$RUNNER_TEMP/tuku-package"
          OUTPUT="$RUNNER_TEMP/output"

          mkdir -p "$STAGE/DEBIAN"
          mkdir -p "$STAGE/usr/bin"
          mkdir -p "$STAGE/usr/lib/tuku/.compiler/Packages"
          mkdir -p "$STAGE/usr/share/doc/tuku"

          # Install compiler scripts
          cp .compiler/Compile.sh "$STAGE/usr/lib/tuku/.compiler/"
          cp .compiler/Compiler-c.sh "$STAGE/usr/lib/tuku/.compiler/"
          cp .compiler/Compiler-c++.sh "$STAGE/usr/lib/tuku/.compiler/"
          cp '.compiler/Compile-c#.sh' "$STAGE/usr/lib/tuku/.compiler/"
          cp .compiler/Packages/FetchPackages.sh "$STAGE/usr/lib/tuku/.compiler/Packages/"

          chmod +x "$STAGE/usr/lib/tuku/.compiler/"*.sh
          chmod +x "$STAGE/usr/lib/tuku/.compiler/Packages/"*.sh

          # Generate TUKU command
          cat > "$STAGE/usr/bin/tuku" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="/usr/lib/tuku"

          case "${1:-help}" in
              version|--version)
                  echo "TUKU 0.1.0"
                  ;;
              compile|build)
                  [[ $# -ge 2 ]] || {
                      echo "Usage: tuku compile <source-file>"
                      exit 2
                  }
                  exec bash "$ROOT/.compiler/Compile.sh" "$2"
                  ;;
              packages)
                  exec bash "$ROOT/.compiler/Packages/FetchPackages.sh"
                  ;;
              *)
                  echo "TUKU - Coding Toolkit"
                  echo "Usage:"
                  echo "  tuku version"
                  echo "  tuku compile <file>"
                  echo "  tuku packages"
                  ;;
          esac
          EOF

          chmod 755 "$STAGE/usr/bin/tuku"

          # Debian metadata
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: tuku
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: all
          Maintainer: TUKU contributors
          Description: Termux-first coding toolkit
           C, C++ and C# compilation helpers.
          EOF

          cp LICENSE "$STAGE/usr/share/doc/tuku/copyright"
          cp README.md "$STAGE/usr/share/doc/tuku/README.md"

          mkdir -p "$OUTPUT"

          dpkg-deb --build --root-owner-group \
            "$STAGE" "$OUTPUT/tuku_${VERSION}_all.deb"

          dpkg-deb --info "$OUTPUT/tuku_${VERSION}_all.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: tuku-deb
          path: ${{ runner.temp }}/output/*.deb
          if-no-files-found: error
